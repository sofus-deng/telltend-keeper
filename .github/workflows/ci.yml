name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telltend-keeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm CLI
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Show toolchain
        run: |
          node --version
          npm --version
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and test
        run: npm run check
